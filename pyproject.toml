[project]
name = "ai-cif"
version = "0.1.0"
description = "AI for Pokémon Showdown"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.15.1",
    "showdown-sdk",
    "torch",
    "torchvision",
    "tqdm>=4.70.1",
    "wandb>=0.30.0",
]

[tool.uv.sources]
showdown-sdk = { git = "https://github.com/AlexAuragan/Showdown-SDK.git" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
ai-cif = { workspace = true }


[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "ruff>=0.16.7",
    "tqdm>=4.70.1",
]

[tool.setuptools]
packages = ["ai_cif"]

[tool.setuptools.package-dir]
"" = "."

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


line-length = 80

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
